                            <p className="text-gray-500 max-w-xl mx-auto mb-10 font-light text-lg">{t.hero_desc}</p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <a href="#download" className="relative inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-gradient-to-r from-mio-primary to-mio-secondary text-white font-semibold transition-transform duration-300 hover:scale-105 hover:shadow-[0_0_40px_rgba(180,125,255,0.4)]"><i className="fa-solid fa-download"></i> {t.btn_download}</a>
                                <a href="#" className="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-mio-card/50 border border-mio-border backdrop-blur-sm text-white font-semibold transition-all duration-300 hover:scale-105 hover:border-white/30"><i className="fa-brands fa-github"></i> {t.btn_github}</a>
                                <a href="https://dalink.to/samporter" target="_blank" className="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-mio-card/50 border border-mio-border backdrop-blur-sm text-white font-semibold transition-all duration-300 hover:scale-105 hover:border-white/30"><i className="fa-solid fa-heart text-mio-secondary"></i> {t.btn_support}</a>
                            </div>
                        </motion.div>
                    </section>

                    <section id="features" className="relative py-32 px-6 z-10">
                        <div className="max-w-7xl mx-auto">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center mb-16">
                                <p className="text-mio-primary font-medium mb-4 tracking-wide uppercase text-sm">{t.features_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.features_title}</h2>
                            </motion.div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{t.feat.map((feature, i) => (<FeatureCard key={i} {...feature} index={i} />))}</div>
                        </div>
                    </section>

                    <section id="gallery" className="relative py-32 z-10">
                        <div className="max-w-7xl mx-auto px-6 mb-12">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center">
                                <p className="text-mio-primary font-medium mb-4 tracking-wide uppercase text-sm">{t.gallery_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.gallery_title}</h2>
                            </motion.div>
                        </div>
                        <div className="flex gap-6 overflow-x-auto px-6 pb-6 snap-x snap-mandatory">
                            {[1, 2, 3, 4, 5].map((item) => (
                                <div key={item} className="relative flex-shrink-0 w-[90%] md:w-[700px] snap-center group">
                                    <div className="relative rounded-2xl overflow-hidden border border-mio-border bg-mio-card/50 backdrop-blur-sm h-[400px] transition-all duration-300 group-hover:border-mio-primary/40">
                                        <div className="absolute inset-0 bg-gradient-to-br from-mio-primary/10 to-mio-secondary/10 z-10 pointer-events-none"></div>
                                        <div className="h-full w-full flex items-center justify-center relative overflow-hidden">
                                            <img src={`./${item}.png`} alt={`Mio Client Screenshot ${item}`} className="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="faq" className="relative py-32 px-6 z-10">
                        <div className="max-w-3xl mx-auto">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center mb-16">
                                <p className="text-mio-primary font-medium mb-4 tracking-wide uppercase text-sm">{t.faq_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.faq_title}</h2>
                            </motion.div>
                            <div className="flex flex-col gap-4">
                                {faqItems.map((item, i) => (
                                    <FaqItem 
                                        key={i} 
                                        question={item.q} 
                                        answer={item.a} 
                                        index={i} 
                                        activeIndex={activeFaq} 
                                        setActiveIndex={setActiveFaq} 
                                    />
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="download" className="relative py-32 px-6 z-10 flex flex-col items-center justify-center text-center">
                        <motion.div initial={{ opacity: 0, scale: 0.9 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="relative">
                            <div className="absolute inset-0 bg-gradient-to-r from-mio-primary to-mio-secondary blur-3xl opacity-20 rounded-full"></div>
                            <div className="relative z-10">
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight mb-4 interactive-text">{t.download_title}</h2>
                                <p className="text-gray-500 max-w-xl mx-auto mb-10 font-light text-lg">{t.download_desc}</p>
                                
                                <button onClick={() => setShowPricing(true)} className="relative inline-flex items-center justify-center gap-4 px-12 py-6 rounded-2xl bg-gradient-to-r from-mio-primary to-mio-secondary text-white font-bold text-xl mb-8 transition-all duration-300 hover:scale-105 hover:shadow-[0_0_60px_rgba(180,125,255,0.6)] cursor-pointer">
                                    <i className={`fa-brands ${getOSIcon(userOS)}`}></i> {t.download_for} {userOS}
                                </button>

                                <div className="flex flex-col items-center gap-3 text-gray-400">
                                    <p className="text-sm text-gray-500">{t.download_wrong}</p>
                                    <div className="flex flex-wrap justify-center gap-6 md:gap-8 text-lg font-medium">
                                        <button onClick={() => { setUserOS('Windows'); setShowPricing(true); }} className="platform-link"><i className="fa-brands fa-windows"></i> Windows</button>
                                        <button onClick={() => { setUserOS('macOS'); setShowPricing(true); }} className="platform-link"><i className="fa-brands fa-apple"></i> macOS</button>
                                        <button onClick={() => { setUserOS('Linux'); setShowPricing(true); }} className="platform-link"><i className="fa-brands fa-linux"></i> Linux</button>
                                        <button onClick={() => { setUserOS('Android'); setShowPricing(true); }} className="platform-link"><i className="fa-brands fa-android"></i> Android</button>
                                    </div>
                                    <p className="text-sm text-gray-600 mt-4">{t.download_latest}</p>
                                </div>
                            </div>
                        </motion.div>
                    </section>

                    <footer className="relative py-12 px-6 border-t border-mio-border z-10 bg-mio-bg/50 backdrop-blur-sm">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="text-lg font-bold tracking-wider"><span className="text-white">Mio</span><span className="bg-gradient-to-r from-mio-primary to-mio-secondary bg-clip-text text-transparent"> Client</span></div>
                            <div className="flex items-center gap-8 text-2xl text-gray-400">
                                <a href="https://t.me/ddnetsam" target="_blank" className="hover:text-mio-primary transition-colors"><i className="fa-brands fa-telegram"></i></a>
                                <a href="#" target="_blank" className="hover:text-mio-primary transition-colors"><i className="fa-brands fa-discord"></i></a>
                                <a href="#" target="_blank" className="hover:text-mio-primary transition-colors"><i className="fa-brands fa-github"></i></a>
                                <a href="https://dalink.to/samporter" target="_blank" className="hover:text-mio-secondary transition-colors"><i className="fa-solid fa-heart"></i></a>
                            </div>
                            <p className="text-sm text-gray-600">{t.footer_copy}</p>
                        </div>
                    </footer>

                    <AnimatePresence>
                        {showPricing && (
                            <motion.div 
                                initial={{ opacity: 0 }} 
                                animate={{ opacity: 1 }} 
                                exit={{ opacity: 0 }}
                                onClick={() => { setShowPricing(false); setPremiumSoldOut(false); }}
                                className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-md flex items-center justify-center p-4"
                            >
                                <motion.div 
                                    initial={{ scale: 0.9, opacity: 0, y: 20 }} 
                                    animate={{ scale: 1, opacity: 1, y: 0 }} 
                                    exit={{ scale: 0.9, opacity: 0, y: 20 }}
                                    transition={{ type: "spring", stiffness: 300, damping: 30 }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="relative bg-mio-card border border-mio-border rounded-3xl p-8 md:p-10 max-w-4xl w-full flex flex-col md:flex-row gap-6 md:gap-8 shadow-2xl"
                                >
                                    <button onClick={() => { setShowPricing(false); setPremiumSoldOut(false); }} className="absolute top-4 right-4 text-gray-400 hover:text-white text-2xl transition-colors z-10">
                                        <i className="fa-solid fa-xmark"></i>
                                    </button>

                                    <div className="flex-1 bg-mio-bg/50 border border-mio-border rounded-2xl p-6 flex flex-col items-center text-center">
                                        <i className="fa-solid fa-seedling text-mio-primary text-3xl mb-4"></i>
                                        <h3 className="text-2xl font-bold mb-2">{t.modal_free_title}</h3>
                                        <p className="text-4xl font-extrabold mb-6 text-gray-300">{t.modal_free_price}</p>
                                        <div className="flex flex-col gap-3 text-gray-400 text-left w-full mb-8 flex-1">
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-primary"></i> {t.modal_free_f1}</p>
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-primary"></i> {t.modal_free_f2}</p>
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-primary"></i> {t.modal_free_f3}</p>
                                        </div>
                                        <a 
                                            href={getDownloadLink(userOS)} 
                                            className="w-full inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl bg-mio-card border border-mio-border hover:border-mio-primary/50 transition-all font-semibold text-white"
                                        >
                                            <i className={`fa-brands ${getOSIcon(userOS)}`}></i> {t.modal_free_btn} {userOS}
                                        </a>
                                    </div>

                                    <div className="flex-1 bg-gradient-to-b from-mio-primary/10 to-mio-secondary/5 border-2 border-mio-primary rounded-2xl p-6 flex flex-col items-center text-center relative shadow-[0_0_30px_rgba(180,125,255,0.2)]">
                                        <div className="absolute top-0 right-0 bg-mio-primary text-white text-xs font-bold px-3 py-1 rounded-bl-xl rounded-tr-2xl">PRO</div>
                                        <i className="fa-solid fa-crown text-mio-secondary text-3xl mb-4"></i>
                                        <h3 className="text-2xl font-bold mb-2 bg-gradient-to-r from-mio-primary to-mio-secondary bg-clip-text text-transparent">{t.modal_premium_title}</h3>
                                        <p className="text-4xl font-extrabold mb-6 text-white">{t.modal_premium_price}<span className="text-lg font-light text-gray-400">{t.modal_premium_sub}</span></p>
                                        <div className="flex flex-col gap-3 text-gray-300 text-left w-full mb-8 flex-1">
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-secondary"></i> {t.modal_premium_f1}</p>
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-secondary"></i> {t.modal_premium_f2}</p>
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-secondary"></i> {t.modal_premium_f3}</p>
                                            <p className="flex items-center gap-2"><i className="fa-solid fa-check text-mio-secondary"></i> {t.modal_premium_f4}</p>
                                        </div>
                                        <button 
                                            onClick={() => setPremiumSoldOut(true)} 
                                            className="w-full inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl bg-gradient-to-r from-mio-primary to-mio-secondary text-white font-semibold transition-transform hover:scale-105 shadow-lg"
                                        >
                                            <i className="fa-solid fa-bolt"></i> {t.modal_premium_btn}
                                        </button>
                                        <AnimatePresence>
                                            {premiumSoldOut && (
                                                <motion.div 
                                                    initial={{ opacity: 0, height: 0 }} 
                                                    animate={{ opacity: 1, height: 'auto' }} 
                                                    exit={{ opacity: 0, height: 0 }}
                                                    className="overflow-hidden w-full"
                                                >
                                                    <p className="text-mio-secondary text-sm mt-4 text-center">
                                                        {t.modal_premium_out}
                                                    </p>
                                                </motion.div>
                                            )}
                                        </AnimatePresence>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
