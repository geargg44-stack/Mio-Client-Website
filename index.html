            Windows: /\.(zip|exe|msi)$/i,

        const useReleases = () => {
            const [links, setLinks] = useState({});

            useEffect(() => {
                let cancelled = false;
                (async () => {
                    try {
                        const res = await fetch(`https://api.github.com/repos/${RELEASES_REPO}/releases?per_page=100`, {
                            headers: { Accept: 'application/vnd.github+json' },
                        });
                        if (!res.ok) throw new Error(res.status);
                        const releases = await res.json();

                        const out = {};
                        for (const os of Object.keys(RELEASE_TITLES)) {
                            const wanted = RELEASE_TITLES[os].trim().toLowerCase();
                            const rel = releases.find(
                                (r) => !r.draft && (r.name || '').trim().toLowerCase() === wanted
                            );
                            if (!rel) continue;
                            const asset = rel.assets.find((a) => ASSET_MATCH[os].test(a.name)) || rel.assets[0];
                            if (asset) out[os] = { url: asset.browser_download_url, size: asset.size };
                        }
                        if (!cancelled) setLinks(out);
                    } catch (e) {
                        console.warn('Не удалось загрузить релизы:', e);
                    }
                })();
                return () => { cancelled = true; };
            }, []);

                                <span className={`text-grad ${hw ? 'flicker' : ''}`}>Client</span>
                            </h1>
                            <h2 className="text-2xl md:text-3xl font-light text-gray-300 mb-4 tracking-tight interactive-text">{t.hero_subtitle}</h2>
                            <p className="text-gray-500 max-w-xl mx-auto mb-10 font-light text-lg">{t.hero_desc}</p>
                            <div className="flex flex-col sm:flex-row gap-4 justify-center">
                                <a href="#download" className="glow-primary relative inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-gradient-to-r from-mio-primary to-mio-secondary text-white font-semibold transition-all duration-300 hover:scale-105"><i className="fa-solid fa-download"></i> {t.btn_download}</a>
                                <a href="https://dalink.to/samporter" target="_blank" rel="noopener" className="inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full bg-mio-card/60 border border-mio-border backdrop-blur-sm text-white font-semibold transition-all duration-300 hover:scale-105 hover:border-white/30"><i className="fa-solid fa-heart text-mio-secondary"></i> {t.btn_support}</a>
                            </div>
                        </motion.div>
                    </section>

                    {/* Features */}
                    <section id="features" className="relative py-32 px-6 z-10">
                        <div className="max-w-7xl mx-auto">
                            <SectionHead tag={t.features_tag} title={t.features_title} halloween={hw} />
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                                {t.feat.map((feature, i) => (<FeatureCard key={i} {...feature} index={i} halloween={hw} />))}
                            </div>
                        </div>
                    </section>

                    {/* Gallery */}
                    <section id="gallery" className="relative py-32 z-10">
                        <div className="max-w-7xl mx-auto px-6">
                            <SectionHead tag={t.gallery_tag} title={t.gallery_title} halloween={hw} />
                        </div>
                        <div className="gallery-scroll flex gap-6 overflow-x-auto px-6 pb-6 snap-x snap-mandatory">
                            {[1, 2, 3, 4, 5].map((item) => <GalleryItem key={item} item={item} />)}
                        </div>
                    </section>

                    {/* Performance */}
                    <section id="performance" className="relative py-32 px-6 z-10">
                        <div className="max-w-6xl mx-auto">
                            <SectionHead tag={t.perf_tag} title={t.perf_title} desc={t.perf_desc} halloween={hw} />
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8">
                                {[
                                    { value: 360, suffix: '+', label: t.stat1_label, desc: t.stat1_desc, icon: 'fa-bolt' },
                                    { value: 2, suffix: '', label: t.stat2_label, desc: t.stat2_desc, icon: 'fa-desktop' },
                                    { value: 0.8, suffix: 's', label: t.stat3_label, desc: t.stat3_desc, decimals: 1, icon: 'fa-hourglass-half' }
                                ].map((stat, i) => (
                                    <motion.div key={i} initial={{ opacity: 0, y: 30 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6, delay: i * 0.15 }} className="relative p-10 rounded-2xl border border-mio-border bg-mio-card/70 backdrop-blur-sm text-center overflow-hidden">
                                        <div className="absolute -top-20 -left-20 w-40 h-40 bg-mio-primary/25 rounded-full filter blur-3xl"></div>
                                        <i className={`fa-solid ${stat.icon} absolute top-5 right-5 text-mio-primary/30 text-xl`}></i>
                                        <div className="relative z-10">
                                            <h3 className="text-5xl md:text-6xl font-extrabold mb-2 tracking-tighter bg-gradient-to-r from-white to-gray-500 bg-clip-text text-transparent"><Counter value={stat.value} suffix={stat.suffix} decimals={stat.decimals || 0} /></h3>
                                            <p className="text-xl font-medium text-white mb-1">{stat.label}</p>
                                            <p className="text-gray-500 font-light">{stat.desc}</p>
                                        </div>
                                    </motion.div>
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* FAQ */}
                    <section id="faq" className="relative py-32 px-6 z-10">
                        <div className="max-w-3xl mx-auto">
                            <SectionHead tag={t.faq_tag} title={t.faq_title} halloween={hw} />
                            <div className="flex flex-col gap-3">
                                {faqItems.map((item, i) => (
                                    <FaqItem key={i} question={item.q} answer={item.a} index={i} activeIndex={activeFaq} setActiveIndex={setActiveFaq} halloween={hw} />
                                ))}
                            </div>
                        </div>
                    </section>

                    {/* Download */}
                    <section id="download" className="relative py-32 px-6 z-10 flex flex-col items-center justify-center text-center">
                        <motion.div initial={{ opacity: 0, scale: 0.9 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="relative">
                            <div className="absolute inset-0 bg-gradient-to-r from-mio-primary to-mio-secondary blur-3xl opacity-25 rounded-full"></div>
                            <div className="relative z-10">
                                {hw && <div className="mb-4 text-6xl"><span className="pumpkin-glow">🎃</span></div>}
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight mb-4 interactive-text">{t.download_title}</h2>
                                <p className="text-gray-500 max-w-xl mx-auto mb-10 font-light text-lg">{hw ? t.download_desc_h : t.download_desc}</p>

                                <button onClick={() => openDownload()} className="glow-primary-lg relative inline-flex items-center justify-center gap-4 px-12 py-6 rounded-2xl bg-gradient-to-r from-mio-primary to-mio-secondary text-white font-bold text-xl mb-8 transition-all duration-300 hover:scale-105">
                                    <i className={`fa-brands ${getOSIcon(userOS)}`}></i> {t.download_for} {userOS}
                                </button>

                                <div className="flex flex-col items-center gap-3 text-gray-400">
                                    <p className="text-sm text-gray-500">{t.download_wrong}</p>
                                    <div className="flex flex-wrap justify-center gap-6 md:gap-8 text-lg font-medium">
                                        {[['Windows', 'fa-windows'], ['macOS', 'fa-apple'], ['Linux', 'fa-linux'], ['Android', 'fa-android']].map(([os, ic]) => (
                                            <button key={os} onClick={() => openDownload(os)} className={`platform-link ${userOS === os ? 'active' : ''}`}><i className={`fa-brands ${ic}`}></i> {os}</button>
                                        ))}
                                    </div>
                                    <p className="text-sm text-gray-600 mt-4">{t.download_latest}</p>
                                </div>
                            </div>
                        </motion.div>
                    </section>

                    {/* Footer */}
                    <div className="relative z-10 -mb-px">
                        {hw && <Graveyard />}
                    </div>
                    <footer className="relative py-12 px-6 border-t border-mio-border z-10 bg-mio-card/80 backdrop-blur-sm">
                        <div className="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-6">
                            <div className="text-lg font-bold tracking-wider flex items-center gap-2">
                                {hw && <span className="pumpkin-pulse">🎃</span>}
                                <span><span className="text-white">Mio</span><span className="text-grad"> Client</span></span>
                            </div>
                            <div className="flex items-center gap-8 text-2xl text-gray-400">
                                <a href="https://t.me/ddnetsam" target="_blank" rel="noopener" aria-label="Telegram" className="hover:text-mio-primary transition-colors"><i className="fa-brands fa-telegram"></i></a>
                                <a href="https://discord.gg/CVydaKpS8H" target="_blank" rel="noopener" aria-label="Discord" className="hover:text-mio-primary transition-colors"><i className="fa-brands fa-discord"></i></a>
                                <a href="https://dalink.to/samporter" target="_blank" rel="noopener" aria-label="Support" className="hover:text-mio-secondary transition-colors"><i className="fa-solid fa-heart"></i></a>
                            </div>
                            <div className="text-center md:text-right">
                                <p className="text-sm text-gray-500">{t.footer_copy}</p>
                                {hw && <p className="text-xs text-mio-primary/80 mt-1">{t.footer_h}</p>}
                            </div>
                        </div>
                    </footer>

                    <AnimatePresence>
                        {showPricing && (
                            <motion.div initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }} onClick={closeModal} className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4 overflow-y-auto">
                                <motion.div
                                    initial={{ scale: 0.95, opacity: 0, y: 20 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.95, opacity: 0, y: 20 }}
                                    transition={{ type: 'spring', stiffness: 300, damping: 30 }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="relative glass rounded-3xl p-8 md:p-12 max-w-4xl w-full flex flex-col gap-8 shadow-[0_20px_60px_rgba(0,0,0,0.8)] bg-mio-card/90 my-auto"
                                >
                                    <button onClick={closeModal} aria-label="Close" className="absolute top-6 right-6 text-gray-500 hover:text-white transition-colors z-10"><i className="fa-solid fa-xmark text-lg"></i></button>

                                    <div className="flex flex-col md:flex-row gap-6">
                                        <div className="flex-1 glass rounded-2xl p-8 flex flex-col items-center text-center">
                                            <i className={`fa-solid ${hw ? 'fa-ghost' : 'fa-seedling'} text-mio-primary text-2xl mb-6`}></i>
                                            <h3 className="text-xl font-bold mb-2 tracking-tight">{t.modal_free_title}</h3>
                                            <p className="text-3xl font-extrabold mb-8 text-gray-300 tracking-tight">{t.modal_free_price}</p>
                                            <div className="flex flex-col gap-3 text-gray-400 text-left w-full mb-8 flex-1">
                                                {[t.modal_free_f1, t.modal_free_f2, t.modal_free_f3].map((f, i) => (
                                                    <p key={i} className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-primary text-xs"></i> {f}</p>
                                                ))}
                                            </div>
                                            <a href={getDownloadUrl(userOS)} onClick={handleFreeDownload} className="w-full glass glass-hover inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl text-white font-semibold text-sm">
                                                <i className={`fa-brands ${getOSIcon(userOS)} text-xs`}></i> {t.modal_free_btn} {userOS}
                                            </a>
                                        </div>

                                        <div className="flex-1 relative rounded-2xl p-8 flex flex-col items-center text-center border border-mio-primary/40 shadow-[0_0_40px_rgb(var(--p)/0.15)] overflow-hidden">
                                            <div className="absolute inset-0 bg-gradient-to-b from-mio-primary/10 to-transparent -z-10"></div>
                                            <div className="absolute top-0 right-0 bg-mio-primary text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl tracking-wider">PRO</div>
                                            <i className={`fa-solid ${hw ? 'fa-skull' : 'fa-crown'} text-mio-secondary text-2xl mb-6`}></i>
                                            <h3 className="text-xl font-bold mb-2 tracking-tight text-grad">{t.modal_premium_title}</h3>
                                            <p className="text-3xl font-extrabold mb-8 text-white tracking-tight">{t.modal_premium_price}<span className="text-sm font-light text-gray-500">{t.modal_premium_sub}</span></p>
                                            <div className="flex flex-col gap-3 text-gray-300 text-left w-full mb-8 flex-1">
                                                {[t.modal_premium_f1, t.modal_premium_f2, t.modal_premium_f3, t.modal_premium_f4].map((f, i) => (
                                                    <p key={i} className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-secondary text-xs"></i> {f}</p>
                                                ))}
                                            </div>
                                            <button onClick={handlePremiumClick} className="btn-premium w-full inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl text-white font-semibold text-sm">
                                                <i className="fa-solid fa-bolt text-xs"></i> {t.modal_premium_btn}
                                            </button>
                                        </div>
                                    </div>

                                    <AnimatePresence>
                                        {(premiumSoldOut || showUnavailMsg) && (
                                            <motion.div key="msg" initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="overflow-hidden w-full">
                                                <p className="text-mio-primary text-sm text-center font-medium tracking-wide">{showUnavailMsg ? unavailMsg : t.modal_premium_out}</p>
                                            </motion.div>
                                        )}
                                    </AnimatePresence>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
