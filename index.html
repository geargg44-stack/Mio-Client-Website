                            <div className="inline-block px-4 py-1.5 mb-10 rounded-full glass text-[10px] font-medium text-gray-400 tracking-[0.2em] uppercase">{t.hero_version}</div>
                            <h1 className="text-7xl md:text-[9rem] lg:text-[11rem] font-extrabold tracking-[-0.05em] mb-8 leading-[0.85] interactive-text">
                                <span className="text-white">Mio</span>{" "}<span className="bg-gradient-to-r from-mio-primary to-mio-secondary bg-clip-text text-transparent">Client</span>
                            </h1>
                            <h2 className="text-xl md:text-3xl font-light text-gray-400 mb-6 tracking-tight">{t.hero_subtitle}</h2>
                            <p className="text-gray-600 max-w-xl mx-auto mb-12 font-light text-base md:text-lg leading-relaxed">{t.hero_desc}</p>
                            <div className="flex flex-col sm:flex-row gap-3 justify-center">
                                <a href="#download" className="btn-premium inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full text-white font-semibold text-sm tracking-wide">
                                    <i className="fa-solid fa-download text-xs"></i> {t.btn_download}
                                </a>
                                {/* Заменили GitHub на Support (Поддержать) */}
                                <a href="https://dalink.to/samporter" target="_blank" className="glass glass-hover inline-flex items-center justify-center gap-3 px-8 py-4 rounded-full text-gray-300 font-semibold text-sm transition-all duration-300 tracking-wide">
                                    <i className="fa-solid fa-heart text-xs text-mio-secondary"></i> {t.btn_support}
                                </a>
                            </div>
                        </motion.div>
                    </section>

                    <section id="features" className="relative py-32 px-6 z-10">
                        <div className="max-w-7xl mx-auto">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center mb-20">
                                <p className="text-mio-primary font-medium mb-4 tracking-[0.2em] uppercase text-[10px]">{t.features_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.features_title}</h2>
                            </motion.div>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">{t.feat.map((feature, i) => (<FeatureCard key={i} {...feature} index={i} />))}</div>
                        </div>
                    </section>

                    <section id="gallery" className="relative py-32 z-10">
                        <div className="max-w-7xl mx-auto px-6 mb-16">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center">
                                <p className="text-mio-primary font-medium mb-4 tracking-[0.2em] uppercase text-[10px]">{t.gallery_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.gallery_title}</h2>
                            </motion.div>
                        </div>
                        <div className="flex gap-4 overflow-x-auto px-6 pb-6 snap-x snap-mandatory">
                            {[1, 2, 3, 4, 5].map((item) => (
                                <div key={item} className="relative flex-shrink-0 w-[90%] md:w-[700px] snap-center group">
                                    <div className="relative rounded-2xl overflow-hidden glass h-[400px] transition-all duration-300 group-hover:border-mio-primary/20">
                                        <div className="absolute inset-0 bg-gradient-to-t from-mio-bg via-transparent to-transparent z-10 pointer-events-none"></div>
                                        <div className="h-full w-full flex items-center justify-center relative overflow-hidden">
                                            <img src={`./${item}.png`} alt={`Mio Client Screenshot ${item}`} className="w-full h-full object-cover transition-transform duration-700 group-hover:scale-105" />
                                        </div>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </section>

                    <section id="faq" className="relative py-32 px-6 z-10">
                        <div className="max-w-3xl mx-auto">
                            <motion.div initial={{ opacity: 0, y: 20 }} whileInView={{ opacity: 1, y: 0 }} viewport={{ once: true }} transition={{ duration: 0.6 }} className="text-center mb-20">
                                <p className="text-mio-primary font-medium mb-4 tracking-[0.2em] uppercase text-[10px]">{t.faq_tag}</p>
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight interactive-text">{t.faq_title}</h2>
                            </motion.div>
                            <div className="flex flex-col gap-3">
                                {faqItems.map((item, i) => (
                                    <FaqItem key={i} question={item.q} answer={item.a} index={i} activeIndex={activeFaq} setActiveIndex={setActiveFaq} />
                                ))}
                            </div>
                        </div>
                    </section>

                    <section id="download" className="relative py-32 px-6 z-10 flex flex-col items-center justify-center text-center">
                        <motion.div initial={{ opacity: 0, scale: 0.9 }} whileInView={{ opacity: 1, scale: 1 }} viewport={{ once: true }} transition={{ duration: 0.8 }} className="relative">
                            <div className="absolute inset-0 bg-gradient-to-r from-mio-primary to-mio-secondary blur-[100px] opacity-10 rounded-full"></div>
                            <div className="relative z-10">
                                <h2 className="text-4xl md:text-6xl font-bold tracking-tight mb-4 interactive-text">{t.download_title}</h2>
                                <p className="text-gray-500 max-w-xl mx-auto mb-12 font-light text-lg">{t.download_desc}</p>
                                
                                <button onClick={() => setShowPricing(true)} className="btn-premium inline-flex items-center justify-center gap-4 px-12 py-6 rounded-2xl text-white font-bold text-lg mb-8">
                                    <i className={`fa-brands ${getOSIcon(userOS)}`}></i> {t.download_for} {userOS}
                                </button>

                                <div className="flex flex-col items-center gap-4 text-gray-500">
                                    <p className="text-xs text-gray-600 tracking-wide uppercase">{t.download_wrong}</p>
                                    <div className="flex flex-wrap justify-center gap-8 text-sm font-medium">
                                        <button onClick={() => { setUserOS('Windows'); setShowPricing(true); }} className="text-gray-500 hover:text-white transition-colors tracking-wide"><i className="fa-brands fa-windows mr-2 text-xs"></i>Windows</button>
                                        <button onClick={() => { setUserOS('macOS'); setShowPricing(true); }} className="text-gray-500 hover:text-white transition-colors tracking-wide"><i className="fa-brands fa-apple mr-2 text-xs"></i>macOS</button>
                                        <button onClick={() => { setUserOS('Linux'); setShowPricing(true); }} className="text-gray-500 hover:text-white transition-colors tracking-wide"><i className="fa-brands fa-linux mr-2 text-xs"></i>Linux</button>
                                        <button onClick={() => { setUserOS('Android'); setShowPricing(true); }} className="text-gray-500 hover:text-white transition-colors tracking-wide"><i className="fa-brands fa-android mr-2 text-xs"></i>Android</button>
                                    </div>
                                    <p className="text-xs text-gray-700 mt-4 tracking-wide">{t.download_latest}</p>
                                </div>

                                <div className="mt-20 pt-10 border-t border-white/5 max-w-md mx-auto">
                                    <p className="text-gray-600 text-[10px] font-medium tracking-[0.2em] uppercase mb-4">{t.launcher_title}</p>
                                    <p className="text-gray-700 text-xs mb-6">{t.launcher_desc}</p>
                                    <div className="flex flex-wrap justify-center gap-3 text-xs font-medium">
                                        <a href="./downloads/MioLauncher-Windows.zip" className="glass glass-hover inline-flex items-center gap-2 px-4 py-2 rounded-full text-gray-400 hover:text-white transition-all">
                                            <i className="fa-brands fa-windows"></i> {t.launcher_win}
                                        </a>
                                        <a href="./downloads/MioLauncher-Linux.zip" className="glass glass-hover inline-flex items-center gap-2 px-4 py-2 rounded-full text-gray-400 hover:text-white transition-all">
                                            <i className="fa-brands fa-linux"></i> {t.launcher_linux}
                                        </a>
                                    </div>
                                </div>
                            </div>
                        </motion.div>
                    </section>

                    <footer className="relative pt-20 pb-10 px-6 border-t border-white/5 z-10">
                        <div className="max-w-7xl mx-auto">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-12 mb-16">
                                <div className="flex flex-col gap-4">
                                    <div className="text-xl font-bold tracking-tight">
                                        <span className="text-white">Mio</span><span className="bg-gradient-to-r from-mio-primary to-mio-secondary bg-clip-text text-transparent"> Client</span>
                                    </div>
                                    <p className="text-gray-600 font-light text-xs max-w-xs leading-relaxed">
                                        {t.footer_desc}
                                    </p>
                                </div>
                                <div className="flex flex-col gap-3">
                                    <p className="text-gray-700 uppercase text-[10px] font-bold tracking-[0.2em] mb-2">{t.footer_links_title}</p>
                                    <a href="#features" className="text-gray-500 hover:text-white transition-colors text-sm">{t.nav_features}</a>
                                    <a href="#faq" className="text-gray-500 hover:text-white transition-colors text-sm">{t.nav_faq}</a>
                                    <a href="#gallery" className="text-gray-500 hover:text-white transition-colors text-sm">{t.nav_gallery}</a>
                                    <a href="#download" className="text-gray-500 hover:text-white transition-colors text-sm">{t.nav_download}</a>
                                </div>
                                <div className="flex flex-col gap-3">
                                    <p className="text-gray-700 uppercase text-[10px] font-bold tracking-[0.2em] mb-2">{t.footer_socials_title}</p>
                                    <div className="flex gap-3">
                                        <a href="https://t.me/ddnetsam" target="_blank" className="w-9 h-9 rounded-full glass glass-hover flex items-center justify-center text-gray-500 hover:text-white transition-all text-xs">
                                            <i className="fa-brands fa-telegram"></i>
                                        </a>
                                        <a href="#" target="_blank" className="w-9 h-9 rounded-full glass glass-hover flex items-center justify-center text-gray-500 hover:text-white transition-all text-xs">
                                            <i className="fa-brands fa-discord"></i>
                                        </a>
                                        <a href="#" target="_blank" className="w-9 h-9 rounded-full glass glass-hover flex items-center justify-center text-gray-500 hover:text-white transition-all text-xs">
                                            <i className="fa-brands fa-github"></i>
                                        </a>
                                        <a href="https://dalink.to/samporter" target="_blank" className="w-9 h-9 rounded-full glass glass-hover flex items-center justify-center text-gray-500 hover:text-white transition-all text-xs">
                                            <i className="fa-solid fa-heart"></i>
                                        </a>
                                    </div>
                                </div>
                            </div>
                            <div className="pt-8 border-t border-white/5 flex flex-col md:flex-row items-center justify-between gap-4">
                                <p className="text-gray-700 text-[10px] tracking-[0.1em]">{t.footer_copy}</p>
                                <p className="text-gray-800 text-[10px] tracking-[0.1em]">{t.footer_made}</p>
                            </div>
                        </div>
                    </footer>

                    <AnimatePresence>
                        {showPricing && (
                            <motion.div 
                                initial={{ opacity: 0 }} animate={{ opacity: 1 }} exit={{ opacity: 0 }}
                                onClick={closeModal}
                                className="fixed inset-0 z-[100] bg-black/80 backdrop-blur-xl flex items-center justify-center p-4"
                            >
                                <motion.div 
                                    initial={{ scale: 0.95, opacity: 0, y: 20 }} animate={{ scale: 1, opacity: 1, y: 0 }} exit={{ scale: 0.95, opacity: 0, y: 20 }}
                                    transition={{ type: "spring", stiffness: 300, damping: 30 }}
                                    onClick={(e) => e.stopPropagation()}
                                    className="relative glass rounded-3xl p-8 md:p-12 max-w-4xl w-full flex flex-col gap-8 shadow-[0_20px_60px_rgba(0,0,0,0.8)]"
                                >
                                    <button onClick={closeModal} className="absolute top-6 right-6 text-gray-600 hover:text-white text-sm transition-colors z-10">
                                        <i className="fa-solid fa-xmark text-lg"></i>
                                    </button>

                                    <div className="flex flex-col md:flex-row gap-6">
                                        <div className="flex-1 glass rounded-2xl p-8 flex flex-col items-center text-center">
                                            <i className="fa-solid fa-seedling text-mio-primary text-2xl mb-6"></i>
                                            <h3 className="text-xl font-bold mb-2 tracking-tight">{t.modal_free_title}</h3>
                                            <p className="text-3xl font-extrabold mb-8 text-gray-300 tracking-tight">{t.modal_free_price}</p>
                                            <div className="flex flex-col gap-3 text-gray-500 text-left w-full mb-8 flex-1">
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-primary text-xs"></i> {t.modal_free_f1}</p>
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-primary text-xs"></i> {t.modal_free_f2}</p>
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-primary text-xs"></i> {t.modal_free_f3}</p>
                                            </div>
                                            <a href={userOS === 'Android' ? '#' : getDownloadLink(userOS)} onClick={handleFreeDownload} className="w-full glass glass-hover inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl text-white font-semibold text-sm transition-all">
                                                <i className={`fa-brands ${getOSIcon(userOS)} text-xs`}></i> {t.modal_free_btn} {userOS}
                                            </a>
                                        </div>

                                        <div className="flex-1 relative rounded-2xl p-8 flex flex-col items-center text-center border border-mio-primary/30 shadow-[0_0_40px_rgba(168,85,247,0.1)] overflow-hidden">
                                            <div className="absolute inset-0 bg-gradient-to-b from-mio-primary/10 to-transparent -z-10"></div>
                                            <div className="absolute top-0 right-0 bg-mio-primary text-white text-[10px] font-bold px-3 py-1 rounded-bl-xl rounded-tr-2xl tracking-wider">PRO</div>
                                            <i className="fa-solid fa-crown text-mio-secondary text-2xl mb-6"></i>
                                            <h3 className="text-xl font-bold mb-2 tracking-tight bg-gradient-to-r from-mio-primary to-mio-secondary bg-clip-text text-transparent">{t.modal_premium_title}</h3>
                                            <p className="text-3xl font-extrabold mb-8 text-white tracking-tight">{t.modal_premium_price}<span className="text-sm font-light text-gray-500">{t.modal_premium_sub}</span></p>
                                            <div className="flex flex-col gap-3 text-gray-300 text-left w-full mb-8 flex-1">
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-secondary text-xs"></i> {t.modal_premium_f1}</p>
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-secondary text-xs"></i> {t.modal_premium_f2}</p>
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-secondary text-xs"></i> {t.modal_premium_f3}</p>
                                                <p className="flex items-center gap-3 text-sm"><i className="fa-solid fa-check text-mio-secondary text-xs"></i> {t.modal_premium_f4}</p>
                                            </div>
                                            <button onClick={handlePremiumClick} className="btn-premium w-full inline-flex items-center justify-center gap-3 px-6 py-4 rounded-xl text-white font-semibold text-sm">
                                                <i className="fa-solid fa-bolt text-xs"></i> {t.modal_premium_btn}
                                            </button>
                                        </div>
                                    </div>

                                    <div className="w-full">
                                        <AnimatePresence>
                                            {premiumSoldOut && (
                                                <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="overflow-hidden w-full">
                                                    <p className="text-mio-secondary text-xs mt-2 text-center font-medium tracking-wide">{t.modal_premium_out}</p>
                                                </motion.div>
                                            )}
                                            {showAndroidMsg && (
                                                <motion.div initial={{ opacity: 0, height: 0 }} animate={{ opacity: 1, height: 'auto' }} exit={{ opacity: 0, height: 0 }} className="overflow-hidden w-full">
                                                    <p className="text-mio-secondary text-xs mt-2 text-center font-medium tracking-wide">{t.modal_android_msg}</p>
                                                </motion.div>
                                            )}
                                        </AnimatePresence>
                                    </div>
                                </motion.div>
                            </motion.div>
                        )}
                    </AnimatePresence>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
